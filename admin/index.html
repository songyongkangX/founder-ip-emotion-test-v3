<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>学员测评管理后台</title>
  <link rel="stylesheet" href="admin.css?v=20261009-2">
</head>
<body>
  <main class="admin-shell">
    <section id="setupPanel" class="panel auth-panel hidden" aria-live="polite">
      <p class="eyebrow">后台尚未连接</p>
      <h1>需要先完成数据服务配置</h1>
      <p class="muted">前台网站仍可正常使用，但学员记录不会进入后台。请按项目里的部署说明完成配置。</p>
    </section>

    <section id="authPanel" class="panel auth-panel hidden">
      <div class="brand-mark">IP</div>
      <p class="eyebrow">Founder IP Assessment</p>
      <h1>学员测评管理后台</h1>
      <p class="muted">请输入后台访问密码。</p>

      <form id="loginForm" class="stack-form">
        <label>登录密码
          <input id="loginPassword" type="password" autocomplete="current-password" required placeholder="请输入访问密码" autofocus>
        </label>
        <button class="primary-btn" type="submit">登录后台</button>
      </form>
      <p id="authMessage" class="form-message" aria-live="polite"></p>
    </section>

    <section id="dashboard" class="dashboard hidden">
      <header class="dashboard-header">
        <div>
          <p class="eyebrow">Founder IP Assessment</p>
          <h1>学员测评管理</h1>
          <p class="muted">学员信息总览</p>
        </div>
        <div class="header-actions">
          <details class="manager-menu">
            <summary>管理 <span>⌄</span></summary>
            <button id="inviteButton" type="button">邀请管理员</button>
          </details>
        </div>
      </header>

      <section class="stats-grid" aria-label="测评概览">
        <article class="stat-card"><span>累计测评</span><strong id="totalCount">0</strong></article>
        <article class="stat-card"><span>今日新增</span><strong id="todayCount">0</strong></article>
        <article class="stat-card"><span>最近提交分组</span><strong id="latestGroup">—</strong></article>
      </section>

      <section class="panel data-panel">
        <div class="toolbar">
          <div class="filters">
            <label class="search-field"><span class="sr-only">搜索</span><input id="searchInput" type="search" placeholder="搜索姓名、手机号、分组或账号名称"></label>
          </div>
          <div class="toolbar-actions">
            <span id="recordCount" class="muted"></span>
            <button id="refreshButton" class="ghost-btn" type="button">刷新</button>
          </div>
        </div>

        <div id="submissionRows" class="student-grid"></div>
        <div id="emptyState" class="empty-state hidden">暂时没有符合条件的学员资料。</div>
        <p id="dashboardMessage" class="form-message" aria-live="polite"></p>
      </section>
    </section>
  </main>

  <dialog id="detailDialog" class="dialog detail-dialog">
    <div class="dialog-head">
      <div><p class="eyebrow">测评结果</p><h2 id="detailTitle">学员结果</h2></div>
      <button class="icon-btn" type="button" data-close-dialog="detailDialog" aria-label="关闭">×</button>
    </div>
    <div id="detailContent" class="detail-content"></div>
    <div class="dialog-actions split-actions">
      <button id="deleteSubmissionButton" class="danger-btn" type="button">删除这条记录</button>
      <button class="secondary-btn" type="button" data-close-dialog="detailDialog">关闭</button>
    </div>
  </dialog>

  <dialog id="inviteDialog" class="dialog">
    <div class="dialog-head">
      <div><p class="eyebrow">管理员权限</p><h2>邀请新管理员</h2></div>
      <button class="icon-btn" type="button" data-close-dialog="inviteDialog" aria-label="关闭">×</button>
    </div>
    <p class="muted">填写手机号后即可开通。对方使用手机号与统一密码登录。</p>
    <form id="inviteForm" class="stack-form">
      <label>管理员手机号
        <input id="invitePhone" type="tel" inputmode="numeric" pattern="1[0-9]{10}" maxlength="11" required placeholder="请输入 11 位手机号">
      </label>
      <button class="primary-btn" type="submit">开通管理员</button>
    </form>
    <p id="inviteMessage" class="form-message" aria-live="polite"></p>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>
  <script src="admin.js?v=20261009-2"></script>
</body>
</html>
